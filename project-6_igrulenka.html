<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Tap Tap Dash — вид сзади</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh; background: #1a1a2e; overflow: hidden;
    font-family: 'Segoe UI', Arial, sans-serif;
    touch-action: manipulation;
  }
  #game {
    position: relative; border-radius: 12px; overflow: hidden;
    box-shadow: 0 0 40px rgba(100, 200, 255, 0.2);
  }
  canvas { display: block; }
  #ui {
    position: absolute; inset: 0; pointer-events: none;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    color: #fff; text-align: center;
  }
  #score {
    position: absolute; top: 16px; left: 20px;
    font-size: 28px; font-weight: 700;
    text-shadow: 0 2px 8px rgba(0,0,0,0.5);
  }
  #overlay {
    pointer-events: auto; cursor: pointer;
    background: rgba(10, 10, 30, 0.8);
    padding: 30px 40px; border-radius: 16px;
    backdrop-filter: blur(4px);
    max-width: 90%;
  }
  #overlay h1 { font-size: 32px; margin-bottom: 14px; color: #4fc3f7; }
  #overlay p { font-size: 15px; opacity: 0.9; line-height: 1.7; }
  #overlay .keys {
    display: flex; gap: 10px; justify-content: center;
    margin: 14px 0;
  }
  #overlay .key {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 52px; height: 52px; padding: 0 14px;
    background: rgba(79, 195, 247, 0.15);
    border: 2px solid #4fc3f7;
    border-radius: 10px;
    font-size: 24px; font-weight: 700; color: #4fc3f7;
    box-shadow: 0 0 12px rgba(79, 195, 247, 0.3);
  }
  #overlay .keys .sep {
    display: inline-flex; align-items: center;
    font-size: 18px; opacity: 0.6;
  }
  #overlay .hint {
    margin-top: 10px; font-size: 13px; opacity: 0.6;
  }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="game">
  <canvas id="canvas"></canvas>
  <div id="ui">
    <div id="score">0</div>
    <div id="overlay">
      <h1>Tap Tap Dash</h1>
      <p>Поворачивайте шарик стрелками:</p>
      <div class="keys">
        <span class="key">←</span>
        <span class="sep">/</span>
        <span class="key">→</span>
      </div>
      <p>← влево · → вправо</p>
      <p class="hint">Шарик едет сам. Не съезжайте с дорожки!</p>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const overlay = document.getElementById('overlay');

const W = Math.min(window.innerWidth - 20, 480);
const H = Math.min(window.innerHeight - 20, 720);
canvas.width = W;
canvas.height = H;

const TILE = 60;
const BASE_INTERVAL = 20;
const SIDE = 0.45;
const ISO = 0.5;

const DIRS = [[1,0],[0,1],[-1,0],[0,-1]];

let state = 'menu';
let score = 0;
let interval = BASE_INTERVAL;
let cameraY = 0;
let frameTimer = 0;

const player = {
  gx: 0, gz: 0,
  fx: 0, fz: 0,
  dir: 0,
  visualDir: 0,
  targetDir: 0,
  alive: true,
  moving: false,
  fromX: 0, fromZ: 0,
  toX: 0, toZ: 0,
  t: 0
};

let tiles = new Map();
let coins = [];

function key(x, z) { return x + ',' + z; }

function buildPath() {
  tiles.clear();
  coins = [];
  let x = 0, z = 0, dir = 0;
  for (let dx = -1; dx <= 1; dx++)
    for (let dz = -1; dz <= 1; dz++)
      tiles.set(key(dx, dz), true);

  for (let i = 0; i < 150; i++) {
    if (i > 1 && Math.random() < 0.3) {
      dir = (dir + (Math.random() < 0.5 ? 1 : 3)) % 4;
    }
    x += DIRS[dir][0];
    z += DIRS[dir][1];
    tiles.set(key(x, z), true);
    if (Math.random() < 0.3) coins.push({ x, z, taken: false });
  }
}

// ==== Камера сзади шарика ====
// Мир поворачивается так, чтобы направление шарика смотрело «вверх» экрана.
// Используем ту же изометрию, но добавляем поворот вокруг шарика на -visualDir * 90°.
// Угол поворота экрана = -visualDir (в четвертях). 0 = смотрим как было (dir 0 = +x).

// Поворот точки мира (wx, wz) вокруг точки (px, pz) на угол -angleQuarter*90°
function rotateAround(wx, wz, px, pz, quarter) {
  // quarter: 0..3 — на сколько четвертей повернуть по часовой
  // приведём к целому 0..3
  quarter = ((quarter % 4) + 4) % 4;
  const dx = wx - px;
  const dz = wz - pz;
  switch (quarter) {
    case 0: return { x: px + dx,     z: pz + dz };
    case 1: return { x: px + dz,     z: pz - dx };  // поворот на -90° (по часовой в мире)
    case 2: return { x: px - dx,     z: pz - dz };
    case 3: return { x: px - dz,     z: pz + dx };
  }
}

// Изометрическая проекция с учётом того, что «вперёд» — это направление шарика.
// Мы поворачиваем мир на -visualDir (дробно) и проецируем.
// Чтобы поворот был плавным, interpolate угол через visualDir (0..4).
function projectWorld(wx, wz, wy) {
  // Центр вращения — позиция шарика
  const px = player.fx;
  const pz = player.fz;

  // Плавный угол поворота (в радианах). Направление взгляда шарика = visualDir.
  // Мы хотим, чтобы направление шарика на экране смотрело вверх-вперёд.
  // В «исходной» изометрии dir 0 (+x) уходит вправо-вниз. Нам надо,
  // чтобы dir 0 смотрел «вверх» (в даль). Значит повернём мир на -45° - 90°*dir?
  // Проще: определим «экранный угол» для каждого направления и повернём так,
  // чтобы текущее направление было = -90° (вверх экрана) в изометрии.

  // В изометрии мировое направление (dx, dz) даёт экранный вектор:
  //   screen = ( (dx - dz) * 0.5, (dx + dz) * 0.25 )
  // Углы (в экранных координатах, atan2(y, x)):
  //   dir 0 (+x):  atan2(0.25, 0.5)   ≈ 26.6°
  //   dir 1 (+z):  atan2(0.25, -0.5)  ≈ 153.4°
  //   dir 2 (-x):  atan2(-0.25, -0.5) ≈ -153.4°
  //   dir 3 (-z):  atan2(-0.25, 0.5)  ≈ -26.6°
  // Мы хотим, чтобы направление шарика (visualDir) смотрело вверх (угол -90°).
  // Значит нужно повернуть мир на (targetAngle - currentAngle).
  // targetAngle = -90° = -PI/2.

  const baseAngles = [
    Math.atan2(0.25, 0.5),
    Math.atan2(0.25, -0.5),
    Math.atan2(-0.25, -0.5),
    Math.atan2(-0.25, 0.5)
  ];
  // Текущий экранный угол направления шарика
  const a0 = Math.floor(player.visualDir) % 4;
  const a1 = (a0 + 1) % 4;
  const frac = player.visualDir - Math.floor(player.visualDir);
  let ang0 = baseAngles[a0];
  let ang1 = baseAngles[a1];
  let dAng = ang1 - ang0;
  while (dAng > Math.PI) dAng -= Math.PI * 2;
  while (dAng < -Math.PI) dAng += Math.PI * 2;
  const currentScreenAngle = ang0 + dAng * frac;

  // Насколько повернуть мир: цель — чтобы направление смотрело вверх (-PI/2)
  const targetScreenAngle = -Math.PI / 2;
  const worldRotation = targetScreenAngle - currentScreenAngle;

  // Поворачиваем точку вокруг шарика
  const cos = Math.cos(worldRotation);
  const sin = Math.sin(worldRotation);
  const dx = wx - px;
  const dz = wz - pz;
  const rdx = dx * cos - dz * sin;
  const rdz = dx * sin + dz * cos;

  // Теперь проецируем с изометрией
  // (в проекции dir 0 = +x уходит вправо-вниз; но мы уже повернули)
  const isoX = (rdx - rdz) * TILE * 0.5;
  const isoY = (rdx + rdz) * TILE * 0.25 * ISO * 2;

  // Шарик помещаем в нижнюю часть экрана
  const originX = W / 2;
  const originY = H * 0.72;

  return {
    sx: originX + isoX,
    sy: originY + isoY - wy - cameraY
  };
}

// ==== Управление ====
function turn(delta) {
  if (state === 'menu' || state === 'dead') { startGame(); return; }
  if (state !== 'playing') return;
  player.dir = (player.dir + (delta > 0 ? 1 : 3)) % 4;
  player.targetDir = player.dir;
}

window.addEventListener('keydown', e => {
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') {
    e.preventDefault(); turn(-1);
  } else if (e.code === 'ArrowRight' || e.code === 'KeyD') {
    e.preventDefault(); turn(1);
  } else if (e.code === 'Space') {
    e.preventDefault();
    if (state === 'menu' || state === 'dead') startGame();
  }
});
window.addEventListener('mousedown', e => {
  if (state === 'menu' || state === 'dead') { startGame(); return; }
  if (state !== 'playing') return;
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  turn(x < W / 2 ? -1 : 1);
});
window.addEventListener('touchstart', e => {
  if (state === 'menu' || state === 'dead') { startGame(); return; }
  if (state !== 'playing') return;
  const rect = canvas.getBoundingClientRect();
  const t = e.touches[0];
  const x = t.clientX - rect.left;
  turn(x < W / 2 ? -1 : 1);
}, {passive:false});

function startGame() {
  state = 'playing';
  score = 0;
  interval = BASE_INTERVAL;
  cameraY = 0;
  frameTimer = 0;
  scoreEl.textContent = '0';
  overlay.classList.add('hidden');
  buildPath();

  player.gx = 0; player.gz = 0;
  player.fx = 0; player.fz = 0;
  player.dir = 0; player.alive = true;
  player.moving = false; player.t = 0;
  player.fromX = 0; player.fromZ = 0;
  player.toX = 0; player.toZ = 0;
  player.visualDir = 0;
  player.targetDir = 0;
}

function collectCoin(tx, tz) {
  for (const c of coins) {
    if (!c.taken && c.x === tx && c.z === tz) { c.taken = true; return true; }
  }
  return false;
}

function die() {
  state = 'dead';
  player.alive = false;
  overlay.classList.remove('hidden');
  overlay.innerHTML = `
    <h1>Игра окончена</h1>
    <p>Ваш счёт: <b>${score}</b></p>
    <p style="margin-top:14px;opacity:0.85">Управление: <b>←</b> влево · <b>→</b> вправо</p>
    <p style="margin-top:10px;opacity:0.6">Нажмите, чтобы попробовать снова</p>
  `;
}

function update() {
  if (state !== 'playing') return;

  // Плавный визуальный поворот
  let diff = (player.targetDir - player.visualDir);
  while (diff > 2) diff -= 4;
  while (diff <= -2) diff += 4;
  player.visualDir += diff * 0.15;
  if (player.visualDir < 0) player.visualDir += 4;
  if (player.visualDir >= 4) player.visualDir -= 4;

  if (player.moving) {
    player.t += 1 / Math.max(6, Math.round(interval * 0.6));
    if (player.t >= 1) { player.t = 1; player.moving = false; }
    player.fx = player.fromX + (player.toX - player.fromX) * player.t;
    player.fz = player.fromZ + (player.toZ - player.fromZ) * player.t;
  }

  if (!player.moving) {
    frameTimer++;
    if (frameTimer >= interval) {
      frameTimer = 0;
      const [dx, dz] = DIRS[player.dir];
      const nx = player.gx + dx;
      const nz = player.gz + dz;
      if (tiles.has(key(nx, nz))) {
        player.fromX = player.gx;
        player.fromZ = player.gz;
        player.toX = nx;
        player.toZ = nz;
        player.t = 0;
        player.moving = true;
        player.gx = nx;
        player.gz = nz;
        collectCoin(nx, nz);
        score += 1;
        scoreEl.textContent = score;
        interval = Math.max(9, BASE_INTERVAL - score * 0.15);
      } else {
        die();
        return;
      }
    }
  }
}

// ==== Рендер ====
function drawTile(wx, wz, isPlayerTile) {
  const half = 0.48;
  // 4 угла плитки в мире (в плоскости пола)
  const corners = [
    [wx - half, wz - half],
    [wx + half, wz - half],
    [wx + half, wz + half],
    [wx - half, wz + half]
  ];
  const proj = corners.map(([x, z]) => projectWorld(x, z, 0));

  // Проверим, что плитка хотя бы частично на экране
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for (const p of proj) {
    if (p.sx < minX) minX = p.sx;
    if (p.sx > maxX) maxX = p.sx;
    if (p.sy < minY) minY = p.sy;
    if (p.sy > maxY) maxY = p.sy;
  }
  if (maxX < -50 || minX > W + 50) return;
  if (maxY < -50) return;
  if (minY > H + 50) return;

  // Боковые грани (вниз)
  const depth = TILE * SIDE;
  const bottomProj = corners.map(([x, z]) => {
    const p = projectWorld(x, z, -depth);
    return p;
  });

  // Рисуем все 4 боковые грани (это просто, и отсечение сделает невидимые)
  for (let i = 0; i < 4; i++) {
    const j = (i + 1) % 4;
    ctx.beginPath();
    ctx.moveTo(proj[i].sx, proj[i].sy);
    ctx.lineTo(proj[j].sx, proj[j].sy);
    ctx.lineTo(bottomProj[j].sx, bottomProj[j].sy);
    ctx.lineTo(bottomProj[i].sx, bottomProj[i].sy);
    ctx.closePath();
    ctx.fillStyle = isPlayerTile ? '#01579b' : '#0d3038';
    ctx.fill();
  }

  // Верхняя грань
  ctx.beginPath();
  ctx.moveTo(proj[0].sx, proj[0].sy);
  for (let i = 1; i < 4; i++) ctx.lineTo(proj[i].sx, proj[i].sy);
  ctx.closePath();

  if (isPlayerTile) {
    ctx.fillStyle = '#4fc3f7';
  } else {
    ctx.fillStyle = '#2e7d8a';
  }
  ctx.fill();
  ctx.strokeStyle = 'rgba(120,220,255,0.35)';
  ctx.lineWidth = 1;
  ctx.stroke();
}

function drawCoin(wx, wz) {
  const p = projectWorld(wx, wz, 22);
  // Масштаб по «глубине»: чем дальше, тем меньше. Приблизительный:
  // ближе к центру — больше. Используем расстояние от шарика.
  const dx = wx - player.fx;
  const dz = wz - player.fz;
  const dist = Math.hypot(dx, dz);
  const scale = Math.max(0.4, 1 - dist * 0.08);
  const r = 7 * scale;
  const bob = Math.sin(Date.now() * 0.005 + wx + wz) * 3;

  ctx.save();
  ctx.shadowColor = '#ffd54f';
  ctx.shadowBlur = 12;
  ctx.beginPath();
  ctx.arc(p.sx, p.sy + bob, r, 0, Math.PI * 2);
  ctx.fillStyle = '#ffd54f';
  ctx.fill();
  ctx.beginPath();
  ctx.arc(p.sx, p.sy + bob, r * 0.55, 0, Math.PI * 2);
  ctx.fillStyle = '#ffb300';
  ctx.fill();
  ctx.restore();
}

function drawPlayer() {
  if (!player.alive) return;
  const p = projectWorld(player.fx, player.fz, 22);
  const r = 15;
  ctx.save();
  ctx.shadowColor = '#00e5ff';
  ctx.shadowBlur = 20;
  const g = ctx.createRadialGradient(p.sx - 4, p.sy - 4, 2, p.sx, p.sy, r);
  g.addColorStop(0, '#b3e5fc');
  g.addColorStop(1, '#0288d1');
  ctx.beginPath();
  ctx.arc(p.sx, p.sy, r, 0, Math.PI * 2);
  ctx.fillStyle = g;
  ctx.fill();

  // Направление «взгляда» — всегда вверх на экране, так как камера сзади.
  // Но добавим небольшую ориентацию по visualDir для плавного перехода — на самом деле
  // камера уже повёрнута, так что шарик «смотрит» вверх. Нарисуем глазик сверху.
  ctx.beginPath();
  ctx.arc(p.sx + 3, p.sy - 5, 4, 0, Math.PI * 2);
  ctx.fillStyle = '#fff';
  ctx.fill();
  ctx.beginPath();
  ctx.arc(p.sx + 3, p.sy - 6, 2, 0, Math.PI * 2);
  ctx.fillStyle = '#0d3038';
  ctx.fill();
  ctx.restore();
}

function render() {
  // Фон: небо сверху + земля снизу
  const horizonY = H * 0.55;
  const skyGrad = ctx.createLinearGradient(0, 0, 0, horizonY);
  skyGrad.addColorStop(0, '#0f0f23');
  skyGrad.addColorStop(1, '#2a2a5e');
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, W, horizonY);

  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  for (let i = 0; i < 80; i++) {
    const sx = (i * 137.5 + 30) % W;
    const sy = (i * 89.7 + 20) % horizonY;
    ctx.fillRect(sx, sy, 1.5, 1.5);
  }

  const floorGrad = ctx.createLinearGradient(0, horizonY, 0, H);
  floorGrad.addColorStop(0, '#0a1a2a');
  floorGrad.addColorStop(1, '#020608');
  ctx.fillStyle = floorGrad;
  ctx.fillRect(0, horizonY, W, H - horizonY);

  if (state === 'menu') {
    // Покажем шарик на стартовой площадке
    drawPlayer();
    return;
  }

  // Собираем плитки в поле зрения и сортируем по «глубине» (дальние сначала).
  // Глубина = расстояние по направлению взгляда; приблизительно = -sy (больше sy — ближе).
  const tileList = [];
  for (const k of tiles.keys()) {
    const [x, z] = k.split(',').map(Number);
    const dx = x - player.fx;
    const dz = z - player.fz;
    const dist = Math.hypot(dx, dz);
    if (dist > 18) continue; // отсечка по дальности
    tileList.push({ x, z, dist });
  }
  // Сортируем дальние → ближние (по dist)
  tileList.sort((a, b) => b.dist - a.dist);

  const ptx = Math.round(player.fx), ptz = Math.round(player.fz);

  // Плитки (дальние → ближние)
  for (const t of tileList) {
    const isPlayer = (t.x === ptx && t.z === ptz);
    drawTile(t.x, t.z, isPlayer);
  }

  // Монеты
  for (const c of coins) {
    if (c.taken) continue;
    const dx = c.x - player.fx;
    const dz = c.z - player.fz;
    if (Math.hypot(dx, dz) > 18) continue;
    drawCoin(c.x, c.z);
  }

  // Шарик сверху (ближе всех к камере)
  drawPlayer();
}

function loop() {
  update();
  render();
  requestAnimationFrame(loop);
}

buildPath();
loop();

window.addEventListener('resize', () => location.reload());
</script>
</body>
</html>
